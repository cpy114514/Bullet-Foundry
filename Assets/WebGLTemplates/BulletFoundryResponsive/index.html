<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #unity-container,
      #unity-canvas {
        width: 100%;
        height: 100%;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        background: #fff;
      }

      #unity-canvas {
        display: block;
        outline: none;
      }

      #unity-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        font: 600 16px Arial, sans-serif;
      }

      #unity-loading-content {
        width: min(320px, 68vw);
        text-align: center;
      }

      #unity-progress-track {
        height: 10px;
        margin-top: 14px;
        overflow: hidden;
        border: 2px solid #111;
        background: #fff;
      }

      #unity-progress {
        width: 0;
        height: 100%;
        background: #111;
        transition: width 120ms linear;
      }

      #unity-warning {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 2;
        width: min(560px, calc(100vw - 32px));
        transform: translateX(-50%);
        font: 14px Arial, sans-serif;
      }

      .unity-warning-item {
        margin-bottom: 8px;
        padding: 10px 12px;
        border: 2px solid #111;
        background: #fff;
        color: #111;
      }

      .unity-warning-item.error {
        background: #111;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
      <div id="unity-loading">
        <div id="unity-loading-content">
          <div>LOADING</div>
          <div id="unity-progress-track"><div id="unity-progress"></div></div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progress = document.querySelector("#unity-progress");

      function unityShowBanner(message, type) {
        const banner = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.className = "unity-warning-item" + (type === "error" ? " error" : "");
        item.textContent = message;
        banner.appendChild(item);

        if (type !== "error") {
          window.setTimeout(() => item.remove(), 5000);
        }
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      const script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, config, (value) => {
          progress.style.width = `${Math.round(value * 100)}%`;
        }).then((instance) => {
          loading.remove();

          // Browsers only permit fullscreen requests during a user gesture.
          // Enter it on the first interaction, then keep double-click as a
          // way to return to fullscreen after the player exits it.
          let requestedInitialFullscreen = false;
          const enterInitialFullscreen = () => {
            if (requestedInitialFullscreen) {
              return;
            }

            requestedInitialFullscreen = true;
            instance.SetFullscreen(1);
          };

          canvas.addEventListener("pointerdown", enterInitialFullscreen, { once: true });
          window.addEventListener("keydown", enterInitialFullscreen, { once: true });
          canvas.addEventListener("dblclick", () => instance.SetFullscreen(1));
        }).catch((error) => unityShowBanner(error, "error"));
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
